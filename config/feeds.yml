version: 1
preset: vanilla

# focus é apenas uma dica para a LLM e para a distribuição de candidatas.
# A classificação final continua sendo decidida pelo Ollama.
# images: page ignora a arte do RSS e busca a imagem da página da matéria.
# images: false desativa imagens para uma fonte específica.
