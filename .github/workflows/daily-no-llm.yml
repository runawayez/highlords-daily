name: Highlords Daily — sem LLM

on:
  workflow_dispatch:
  schedule:
    # 08:00 em America/Sao_Paulo (UTC-3)
    - cron: '0 11 * * *'

permissions:
  contents: read

concurrency:
  group: highlords-daily-no-llm
  cancel-in-progress: true

jobs:
  generate:
    name: Gerar newsletter e PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TIME_ZONE: America/Sao_Paulo
      AUTO_OPEN: 'false'
      LOOKBACK_HOURS: '36'
      MAX_ITEMS_PER_FEED: '18'
      MAX_CANDIDATES: '120'
      ITEMS_PER_CATEGORY: '2'
      MIN_SCORE: '6'
      OUTPUT_DIR: ./output

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Generate Highlords Daily without LLM
        run: npm run daily:no-llm

      - name: Build run summary
        if: always()
        shell: bash
        run: |
          echo '## Highlords Daily — sem LLM' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/latest-no-llm.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Newsletter gerada com classificação por regras, score editorial, deduplicação por similaridade, recência e diversidade de fontes.' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            node -e "const fs=require('fs'); const e=JSON.parse(fs.readFileSync('output/latest-no-llm.json')); console.log('- Matérias na edição: **'+e.stats.stories+'**\n- Fontes: **'+e.stats.sources+'**\n- Candidatas aprovadas: **'+e.stats.candidates+'**\n- Data: **'+e.editionDate+'**')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'A newsletter não foi gerada. Consulte os logs do job.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload newsletter artifact
        uses: actions/upload-artifact@v4
        with:
          name: highlords-daily-no-llm-${{ github.run_number }}
          path: |
            output/highlords-daily-no-llm-latest.pdf
            output/latest-no-llm.html
            output/latest-no-llm.json
            output/*/no-llm/diagnostics.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
