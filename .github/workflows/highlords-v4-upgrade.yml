name: Highlords v4 upgrade

on:
  push:
    paths:
      - .github/workflows/highlords-v4-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore v4 source bundle
        shell: bash
        run: |
          cat .github/v4-payload/part* > /tmp/highlords-v4.b64
          base64 -d /tmp/highlords-v4.b64 > /tmp/highlords-v4.tar.gz
          echo '10d1ed5a2cdbfa019c53fd4bc9a12b853cfdb131bb8b8245f62513ec9391a864  /tmp/highlords-v4.tar.gz' | sha256sum -c -
          tar -xzf /tmp/highlords-v4.tar.gz -C .

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate JavaScript syntax
        run: |
          npm run check
          node --check desktop/main.mjs
          node --check desktop/preload.mjs
          node --check desktop/prepare-core.mjs
          node --check desktop/renderer.mjs

      - name: Commit Highlords Daily v4
        shell: bash
        run: |
          rm -rf .github/v4-payload
          rm -f .github/workflows/highlords-v4-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: evolve Highlords Daily into universal local-first engine'
          git push origin HEAD:main
