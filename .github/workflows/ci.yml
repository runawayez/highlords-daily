name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check formatting
        shell: bash
        run: npm run format:check || (npx prettier --write src/editorial/edition.mjs tests/editorial-contract.test.mjs && git diff -- src/editorial/edition.mjs tests/editorial-contract.test.mjs && exit 1)
      - run: npm run check
      - run: npm test
      - run: node desktop/prepare-core.mjs
