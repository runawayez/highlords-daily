name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run editorial:evaluate
      - run: npm run benchmark
      - run: node desktop/prepare-core.mjs
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update
      - run: sudo apt-get install -y poppler-utils
      - run: npm run test:visual
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          REQUIRE_PDF_TEXT_CHECKS: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression
          path: data/visual-regression/
