version: 1
preset: global

feeds:
  - name: Tecnoblog
    url: https://tecnoblog.net/feed/
    focus: [ia, mobile-gadgets, hardware, software-internet]
  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
    focus: [ia, mobile-gadgets, hardware, software-internet, games, filmes-series, ciencia, futuro]
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    focus: [ia, desenvolvimento, hardware, software-internet, ciencia, futuro]
  - name: Hacker News
    url: https://news.ycombinator.com/rss
    focus: [ia, desenvolvimento, software-internet, futuro]
  - name: TechCrunch
    url: https://techcrunch.com/feed/
    focus: [ia, desenvolvimento, software-internet, economia, futuro]
  - name: GitHub Blog
