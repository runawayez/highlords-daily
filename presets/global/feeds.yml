  # World affairs, politics and society. This feed is intentionally broad so
  # Ollama can reject or reclassify stories according to the configured taxonomy.
  - name: BBC News World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    language: en-GB
    country: GB
    coverage: [GLOBAL]
    focus: [politica-sociedade, economia, saude, clima-meio-ambiente]
    images: page

