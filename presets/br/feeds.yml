    strict_focus: true

  - name: Diolinux
    url: https://diolinux.com.br/feed
    focus: [desenvolvimento, software-internet, hardware]
    strict_focus: true

  # TabNews é excelente como fonte textual, mas os previews Open Graph são cards
  # gerados com texto, não imagens editoriais. No Vanilla REQUIRE_IMAGES=true,
  # por isso ele fica disponível apenas para quem optar por aceitar matérias sem imagem.
  - name: TabNews
    url: https://www.tabnews.com.br/recentes/rss
    focus: [ia, desenvolvimento, software-internet, futuro]
    images: false

  - name: Adrenaline
    url: https://www.adrenaline.com.br/feed/
    focus: [hardware, mobile-gadgets, games, esports]
    strict_focus: true

  - name: GameVicio
    url: https://www.gamevicio.com/rss/
    focus: [games, esports]
    strict_focus: true
    images: page

  - name: Flow Games
    url: https://flowgames.gg/feed/
    focus: [games, esports]
    strict_focus: true
    images: page

