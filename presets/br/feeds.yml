  - name: Tecnoblog
    url: https://tecnoblog.net/feed/
    focus: [ia, desenvolvimento, mobile-gadgets, hardware, software-internet, futuro]

  - name: Canaltech
    url: https://canaltech.com.br/rss/
    focus: [ia, desenvolvimento, mobile-gadgets, hardware, software-internet, games, filmes-series, esports, ciencia, saude, futuro]

  - name: TecMundo
    url: https://www.tecmundo.com.br/rss
