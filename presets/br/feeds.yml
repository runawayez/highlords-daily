  - name: g1 · Tecnologia
    url: http://g1.globo.com/dynamo/tecnologia/rss2.xml
    focus: [ia, mobile-gadgets, hardware, software-internet, games, futuro]

  - name: MacMagazine
    url: https://macmagazine.com.br/feed/
    focus: [mobile-gadgets, hardware, software-internet, futuro]
    strict_focus: true

  - name: iMasters
    url: https://imasters.com.br/feed
