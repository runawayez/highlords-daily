services:
  highlords-post:
    build: .
    container_name: highlords-post
    ports:
      - "${PORT:-8090}:8090"
    environment:
      PORT: 8090
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      LOOKBACK_HOURS: ${LOOKBACK_HOURS:-48}
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-120}
      REFRESH_ON_START: ${REFRESH_ON_START:-false}
      MAX_ITEMS_PER_FEED: ${MAX_ITEMS_PER_FEED:-20}
      MIN_SCORE: ${MIN_SCORE:-5}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
